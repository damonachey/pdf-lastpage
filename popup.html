<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PDF Last Page</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="header_container">
      <img src="icons/icon128.png" alt="" id="popup_icon">
      <span id="popup_title">PDF Last Page</span>
    </div>
    <div class="list_container">
      <table id="pdf_table">
        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col" class="last_page">Last page</th>
          </tr>
        </thead>
        <tbody id="pdf_list"></tbody>
      </table>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
